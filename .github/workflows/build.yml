name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Validate app bundle
        run: |
          test -d "Apple Music 音乐信息订正.app"
          test -f "Apple Music 音乐信息订正.app/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict "Apple Music 音乐信息订正.app"

      - name: Package build artifact
        run: ditto -c -k --sequesterRsrc --keepParent "Apple Music 音乐信息订正.app" "Apple-Music-Metadata-Fixer-macOS.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Music-Metadata-Fixer-macOS
          path: Apple-Music-Metadata-Fixer-macOS.zip
