name: Bug report
description: Report an incorrect match or application failure
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove all personal paths, Apple ID information, and credentials before submitting.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.5.1"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the displayed title and album, if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open the app
        2. Add a song
        3. Observe…
    validations:
      required: true
